sonar.projectKey=eve-space
sonar.projectName=EVE Space
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

sonar.sources=app,api/src,layers,packages/platform-module-contract/src,packages/platform-module-nuxt/src,packages/platform-module-server/src,scripts,sde-ingest/src,colada.options.ts,nuxt.config.ts
sonar.tests=tests,api/tests,packages/platform-module-nuxt/test
sonar.exclusions=**/node_modules/**,**/dist/**,.nuxt/**,.output/**,generated/**,**/coverage/**,**/coverage-redis/**,**/target/**,**/*.js,**/*.otf
sonar.coverage.exclusions=**/*.config.ts,**/*.d.ts,scripts/**

sonar.javascript.lcov.reportPaths=coverage/**/lcov.info,api/coverage/lcov.info,api/coverage-redis/lcov.info,packages/platform-module-nuxt/coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
