# https://lefthook.dev/configuration/
#
# Nothing lands unless lint and formatting are clean, both test suites pass, and
# knip reports no dead code. Use `pnpm lint:fix` / `pnpm format` for the
# mechanical fixes and `pnpm knip` to see what is unreachable.
#
# Workspace checks remain repository-wide because dead-code and dependency
# boundaries are cross-file properties. ESI lint and formatting remain
# package-wide but only run when non-generated ESI files changed.
#
# `typecheck` runs on push only. It is the slowest check (~20s for vue-tsc across
# the Nuxt app) and it is the one that catches `.vue` and type-level regressions
# that lint, knip, and Vitest all miss, so it guards the shared branch without
# taxing every local commit.

glob_matcher: doublestar

pre-commit:
  parallel: false
  jobs:
    - name: lint:workspace
      run: pnpm lint:workspace

    - name: lint:esi-client
      exclude:
        - 'packages/esi-client/docs/generated/**'
        - 'packages/esi-client/examples/generated/**'
        - 'packages/esi-client/openapi/generated/**'
        - 'packages/esi-client/src/generated/**'
        - 'packages/esi-client/tests/generated/**'
      glob: 'packages/esi-client/**'
      run: pnpm --filter @evespace/esi-client lint

    - name: format:workspace
      run: pnpm format:check:workspace

    - name: format:esi-client
      exclude:
        - 'packages/esi-client/docs/generated/**'
        - 'packages/esi-client/examples/generated/**'
        - 'packages/esi-client/openapi/generated/**'
        - 'packages/esi-client/src/generated/**'
        - 'packages/esi-client/tests/generated/**'
      glob: 'packages/esi-client/**'
      run: pnpm --filter @evespace/esi-client format:check

    - name: knip
      run: pnpm knip

    - name: test:frontend
      run: pnpm test:frontend

    - name: test:registry
      run: pnpm test:registry

    - name: test:modules
      run: pnpm test:modules

    - name: test:api
      run: pnpm test:api

pre-push:
  parallel: false
  jobs:
    - name: lint:workspace
      run: pnpm lint:workspace

    - name: lint:esi-client
      exclude:
        - 'packages/esi-client/docs/generated/**'
        - 'packages/esi-client/examples/generated/**'
        - 'packages/esi-client/openapi/generated/**'
        - 'packages/esi-client/src/generated/**'
        - 'packages/esi-client/tests/generated/**'
      glob: 'packages/esi-client/**'
      run: pnpm --filter @evespace/esi-client lint

    - name: format:workspace
      run: pnpm format:check:workspace

    - name: format:esi-client
      exclude:
        - 'packages/esi-client/docs/generated/**'
        - 'packages/esi-client/examples/generated/**'
        - 'packages/esi-client/openapi/generated/**'
        - 'packages/esi-client/src/generated/**'
        - 'packages/esi-client/tests/generated/**'
      glob: 'packages/esi-client/**'
      run: pnpm --filter @evespace/esi-client format:check

    - name: knip
      run: pnpm knip

    - name: typecheck
      run: pnpm typecheck

    - name: test:frontend:coverage
      run: pnpm test:frontend:coverage

    - name: test:registry
      run: pnpm test:registry

    - name: test:modules:coverage
      run: pnpm test:modules:coverage

    - name: test:api:coverage
      run: pnpm test:api:coverage

    - name: test:redis
      run: pnpm test:redis

    - name: test:postgres
      run: pnpm test:postgres
