type Asset {
  categoryId: EveId
  categoryName: String
  customName: String
  groupId: EveId
  groupName: String
  isBlueprintCopy: Boolean
  isSingleton: Boolean!
  itemId: EveId!
  locationFlag: String!
  locationId: EveId!
  locationName: String
  locationType: String!
  parentItemId: EveId
  quantity: BigInteger!
  solarSystemId: EveId
  solarSystemSecurityStatus: Float
  totalVolume: Float
  typeId: EveId!
  typeName: String!
  unitVolume: Float
}

type AssetConnection {
  anchor: String!
  anchorSource: AssetSource!
  assets: [Asset!]!
  characterId: EveId!
  completeness: String!
  enrichment: AssetEnrichment!
  pageInfo: PageInfo!
  source: AssetSource!
  sourcePage: Int!
  totalSourcePages: Int!
}

type AssetEnrichment {
  locations: String!
  names: String!
  types: String!
}

type AssetSource {
  cachedUntil: UTCTime!
  refreshFailureClass: String
  retryAt: UTCTime
  stale: Boolean!
  validatedAt: UTCTime!
}

scalar BigInteger

scalar Decimal

scalar EveId

type MarketBook {
  collectionStatus: String!
  observation: MarketObservation
  profileId: UUID!
  profileRevision: BigInteger!
  replacement: MarketReplacement
  status: String!
  typeId: EveId!
}

type MarketCatalogueGroupPage {
  groupId: EveId!
  items: [MarketCatalogueType!]!
  nextCursor: String
  revision: String!
}

type MarketCatalogueRevision {
  buildNumber: BigInteger!
  ingestVersion: Int!
  ingestedAt: UTCTime!
  key: String!
}

type MarketCatalogueType {
  groupId: EveId!
  id: EveId!
  name: String!
}

type MarketCatalogueTypeResult {
  item: MarketCatalogueType!
  revision: String!
}

type MarketHistory {
  days: [MarketHistoryDay!]!
  freshUntil: UTCTime
  freshness: String!
  profileId: UUID!
  profileRevision: BigInteger!
  regionId: EveId!
  retainedEvidence: Boolean!
  source: MarketHistorySource
  status: String!
  typeId: EveId!
  validatedAt: UTCTime
}

type MarketHistoryDay {
  averageIsk: Decimal!
  date: UTCDate!
  highIsk: Decimal!
  lowIsk: Decimal!
  orderCount: BigInteger!
  volume: BigInteger!
}

type MarketHistorySource {
  contentRevision: BigInteger!
  freshUntil: UTCTime
  lastAttemptAt: UTCTime!
  lastFailureClass: String
  responseCount: Int
  responseFrom: UTCDate
  responseThrough: UTCDate
  state: String!
  validatedAt: UTCTime!
}

type MarketIntelligenceBookSource {
  freshUntil: UTCTime!
  observationId: UUID!
  observedAt: UTCTime!
  validatedAt: UTCTime!
}

type MarketIntelligenceCatalogueRevision {
  buildNumber: BigInteger!
  ingestVersion: Int!
  ingestedAt: UTCTime!
}

type MarketIntelligenceCoverage {
  bookScope: String!
  catalogueRevision: MarketIntelligenceCatalogueRevision
  evaluatedAt: UTCTime!
  excludedTypeCount: Int
  generation: MarketIntelligenceFrozenCoverage
  historyScope: String!
  ignoredGroupIds: [EveId!]!
  live: MarketIntelligenceCoverageCounts!
  policyEnabled: Boolean!
  policyRevision: BigInteger!
  profileId: UUID!
  profileRevision: BigInteger!
  regionId: EveId!
}

type MarketIntelligenceCoverageCounts {
  eligibleCount: Int!
  emptySource: Int!
  failedLastAttempt: Int!
  failedWithoutSuccess: Int!
  freshSuccess: Int!
  latestAttemptAt: UTCTime
  neverAttempted: Int!
  oldestDueAt: UTCTime
  staleSuccess: Int!
}

enum MarketIntelligenceDirection {
  ASC
  DESC
}

type MarketIntelligenceFrozenCoverage {
  counts: MarketIntelligenceCoverageCounts!
  evaluatedAt: UTCTime!
  generation: MarketIntelligenceGeneration!
}

type MarketIntelligenceGeneration {
  anchorDate: UTCDate!
  bookScope: String!
  catalogueRevision: MarketIntelligenceCatalogueRevision!
  createdAt: UTCTime!
  excludedTypeCount: Int!
  expiresAt: UTCTime
  formulaVersion: Int!
  generationId: UUID!
  historyScope: String!
  policyRevision: BigInteger!
  profileId: UUID!
  profileRevision: BigInteger!
  publishedAt: UTCTime!
  regionId: EveId!
  targetCount: Int!
}

type MarketIntelligenceHistoryRange {
  days: [MarketHistoryDay!]!
  from: UTCDate!
  profileId: UUID!
  profileRevision: BigInteger!
  regionId: EveId!
  retainedEvidence: Boolean!
  source: MarketIntelligenceHistorySource
  through: UTCDate!
  typeId: EveId!
}

type MarketIntelligenceHistorySource {
  contentRevision: BigInteger!
  freshUntil: UTCTime
  lastAttemptAt: UTCTime
  lastFailureClass: String
  state: String!
  validatedAt: UTCTime
}

input MarketIntelligenceInput {
  after: String
  direction: MarketIntelligenceDirection = DESC
  first: Int = 25
  generationId: UUID
  groupIds: [EveId!]
  includeStale: Boolean = false
  minimumAverageDailyOrders: Decimal = "5"
  minimumAverageDailyValueIsk: Decimal = "5000000000"
  minimumBaselineDays: Int = 0
  profileId: UUID!
  sort: MarketIntelligenceSort = anchorTradedValueIsk
  typeIds: [EveId!]
}

type MarketIntelligenceItem {
  generation: MarketIntelligenceGeneration
  row: MarketIntelligenceRow
  status: String!
  typeId: EveId!
}

type MarketIntelligenceMetric {
  complete: Boolean
  denominator: BigInteger
  nullReason: String
  numerator: BigInteger
  observedDays: Int
  value: Decimal
  windowDays: Int
}

type MarketIntelligenceMetricDefinition {
  decimalPlaces: Int!
  formula: String!
  formulaVersion: Int!
  id: MarketIntelligenceSort!
  includesAnchor: Boolean!
  rounding: String!
  source: String!
  unit: String!
  windowDays: Int
}

type MarketIntelligenceMetrics {
  anchorTradedValueIsk: MarketIntelligenceMetric!
  anchorVolumeSpike: MarketIntelligenceMetric!
  averageDailyOrders: MarketIntelligenceMetric!
  averageDailyValueIsk: MarketIntelligenceMetric!
  baselineMonthIsk: MarketIntelligenceMetric!
  baselineWeekIsk: MarketIntelligenceMetric!
  baselineYearIsk: MarketIntelligenceMetric!
  bestAskIsk: MarketIntelligenceMetric!
  bestBidIsk: MarketIntelligenceMetric!
  daysSupply: MarketIntelligenceMetric!
  daysSupply10Percent: MarketIntelligenceMetric!
  sellDepth: MarketIntelligenceMetric!
  sellDepth5Percent: MarketIntelligenceMetric!
  sellDepth10Percent: MarketIntelligenceMetric!
  spreadIsk: MarketIntelligenceMetric!
  spreadPercent: MarketIntelligenceMetric!
  underpriceMonthPercent: MarketIntelligenceMetric!
  underpriceYearPercent: MarketIntelligenceMetric!
  weekPriceChangePercent: MarketIntelligenceMetric!
  weekTradedValueIsk: MarketIntelligenceMetric!
  weekVolumeSpike: MarketIntelligenceMetric!
}

type MarketIntelligencePage {
  generation: MarketIntelligenceGeneration!
  hasMore: Boolean!
  nextCursor: String
  omittedNullSortCount: Int!
  rows: [MarketIntelligenceRow!]!
  total: Int!
}

type MarketIntelligenceRow {
  bookSource: MarketIntelligenceBookSource
  groupId: EveId!
  historySource: MarketIntelligenceHistorySource!
  metrics: MarketIntelligenceMetrics!
  name: String!
  typeId: EveId!
}

enum MarketIntelligenceSort {
  anchorTradedValueIsk
  anchorVolumeSpike
  averageDailyOrders
  averageDailyValueIsk
  baselineMonthIsk
  baselineWeekIsk
  baselineYearIsk
  bestAskIsk
  bestBidIsk
  daysSupply
  daysSupply10Percent
  sellDepth
  sellDepth5Percent
  sellDepth10Percent
  spreadIsk
  spreadPercent
  underpriceMonthPercent
  underpriceYearPercent
  weekPriceChangePercent
  weekTradedValueIsk
  weekVolumeSpike
}

type MarketObservation {
  expectedPages: Int!
  freshUntil: UTCTime!
  observationId: UUID!
  observedAt: UTCTime!
  profileId: UUID!
  regionId: EveId!
  totalBookOrders: BigInteger!
  typeId: EveId!
  validatedAt: UTCTime!
}

type MarketOrder {
  durationDays: Int!
  expiryAt: UTCTime!
  issuedAt: UTCTime!
  locationId: EveId!
  locationName: String
  minimumVolume: BigInteger!
  orderId: EveId!
  price: Decimal!
  range: String!
  side: MarketOrderSide!
  solarSystemId: EveId
  solarSystemSecurityStatus: Float
  volumeRemain: BigInteger!
}

type MarketOrderPage {
  hasMore: Boolean!
  labelsComplete: Boolean!
  nextCursor: String
  observation: MarketObservation!
  observationId: UUID!
  profileRevision: BigInteger!
  rows: [MarketOrder!]!
}

enum MarketOrderSide {
  buy
  sell
}

type MarketProfile {
  marketScope: String!
  mode: String!
  profileId: UUID!
  regionId: EveId!
  revision: BigInteger!
  stationIds: [EveId!]!
  watchedTypeIds: [EveId!]!
}

type MarketRead {
  book(profileId: UUID!, typeId: EveId!): MarketBook
  catalogueGroupTypes(after: String, first: Int = 100, groupId: EveId!, revision: String!): MarketCatalogueGroupPage
  catalogueRevision: MarketCatalogueRevision
  catalogueType(revision: String!, typeId: EveId!): MarketCatalogueTypeResult
  history(profileId: UUID!, typeId: EveId!): MarketHistory
  historyRange(from: UTCDate!, profileId: UUID!, through: UTCDate!, typeId: EveId!): MarketIntelligenceHistoryRange
  intelligence(input: MarketIntelligenceInput!): MarketIntelligencePage
  intelligenceCoverage(profileId: UUID!): MarketIntelligenceCoverage
  intelligenceItem(generationId: UUID, profileId: UUID!, typeId: EveId!): MarketIntelligenceItem
  intelligenceMetricDefinitions: [MarketIntelligenceMetricDefinition!]!
  orders(after: String, first: Int = 100, observationId: UUID!, profileId: UUID!, side: MarketOrderSide!, typeId: EveId!): MarketOrderPage
  profiles: [MarketProfile!]
  referencePrices(typeIds: [EveId!]!): MarketReferencePrices
}

type MarketReferencePrice {
  adjustedPriceIsk: Decimal
  averagePriceIsk: Decimal
  sourceHour: UTCTime!
  typeId: EveId!
  validatedAt: UTCTime!
}

type MarketReferencePrices {
  kind: String!
  rows: [MarketReferencePrice!]!
}

type MarketReplacement {
  attemptedAt: UTCTime!
  status: String!
}

type OwnedCharacter {
  assets(after: String, first: Int! = 25): AssetConnection
  characterId: EveId!
  isMain: Boolean!
  name: String!
}

type OwnedCharacterConnection {
  items: [OwnedCharacterIdentity!]!
  pageInfo: PageInfo!
}

type OwnedCharacterIdentity {
  characterId: EveId!
  isMain: Boolean!
  name: String!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  restartRequired: Boolean!
}

type Query {
  market: MarketRead
  ownedCharacter(characterId: EveId!): OwnedCharacter
  ownedCharacters(after: String, first: Int! = 50): OwnedCharacterConnection
  trading: TradingRead
}

type TradingInventoryCoverage {
  characterId: EveId!
  characterName: String!
  source: TradingInventorySource
  state: String!
}

type TradingInventoryCoverageCounts {
  authorizationRequired: Int!
  beyondRetention: Int!
  conflictingSource: Int!
  includedCurrent: Int!
  includedStale: Int!
  incomplete: Int!
  neverCollected: Int!
  unavailable: Int!
}

type TradingInventoryCoveragePage {
  endCursor: String
  hasNextPage: Boolean!
  rows: [TradingInventoryCoverage!]!
}

input TradingInventoryFilters {
  categoryId: EveId
  groupId: EveId
  locationKey: String
  typeId: EveId
}

type TradingInventoryGroup {
  blueprint: String!
  categoryId: EveId
  currentQuantity: BigInteger!
  groupId: EveId
  key: String!
  location: TradingInventoryLocation!
  staleQuantity: BigInteger!
  typeId: EveId!
  typeName: String
}

type TradingInventoryGroupPage {
  endCursor: String
  hasNextPage: Boolean!
  rows: [TradingInventoryGroup!]!
}

type TradingInventoryHolder {
  characterId: EveId!
  characterName: String!
  currentQuantity: BigInteger!
  groupKey: String!
  source: TradingInventorySource!
  staleQuantity: BigInteger!
  userId: UUID!
}

type TradingInventoryHolderPage {
  endCursor: String
  hasNextPage: Boolean!
  rows: [TradingInventoryHolder!]!
}

enum TradingInventoryKind {
  coverage
  groups
  holders
}

type TradingInventoryLocation {
  id: EveId
  key: String!
  name: String
  state: String!
}

type TradingInventorySource {
  freshUntil: UTCTime!
  observationId: String!
  observedAt: UTCTime!
  retainedUntil: UTCTime!
  validatedAt: UTCTime!
}

type TradingInventoryView {
  corporationId: EveId
  coverage: TradingInventoryCoveragePage!
  coverageCounts: TradingInventoryCoverageCounts!
  expectedSubjects: Int!
  fingerprint: String!
  groups: TradingInventoryGroupPage!
  holders: TradingInventoryHolderPage!
  scope: String!
  sourcesComplete: Boolean!
  traversalComplete: Boolean!
  version: Int!
}

type TradingRead {
  corporationInventory(after: String, corporationId: EveId!, filters: TradingInventoryFilters, first: Int = 50, groupKey: String, kind: TradingInventoryKind = groups): TradingInventoryView
  personalInventory(after: String, characterIds: [EveId!], filters: TradingInventoryFilters, first: Int = 50, groupKey: String, kind: TradingInventoryKind = groups): TradingInventoryView
}

scalar UTCDate

scalar UTCTime

scalar UUID
