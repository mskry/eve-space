fragment TradingInventoryStatus on TradingInventoryView {
  version
  scope
  corporationId
  fingerprint
  traversalComplete
  sourcesComplete
  expectedSubjects
  coverageCounts {
    includedCurrent
    includedStale
    authorizationRequired
    neverCollected
    unavailable
    incomplete
    beyondRetention
    conflictingSource
  }
}
fragment TradingInventoryClock on TradingInventorySource {
  observationId
  observedAt
  validatedAt
  freshUntil
  retainedUntil
}
fragment TradingInventoryGroups on TradingInventoryGroupPage {
  endCursor
  hasNextPage
  rows {
    key
    typeId
    typeName
    groupId
    categoryId
    blueprint
    location {
      key
      id
      name
      state
    }
    currentQuantity
    staleQuantity
  }
}
query TradingPersonalInventory(
  $characterIds: [EveId!]
  $filters: TradingInventoryFilters
  $first: Int = 50
  $after: String
) {
  trading {
    personalInventory(
      characterIds: $characterIds
      filters: $filters
      first: $first
      after: $after
    ) {
      ...TradingInventoryStatus
      groups {
        ...TradingInventoryGroups
      }
    }
  }
}
query TradingCorporationInventory(
  $corporationId: EveId!
