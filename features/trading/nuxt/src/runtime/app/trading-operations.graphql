query TradingPersonalHolders(
  $characterIds: [EveId!]
  $groupKey: String!
  $first: Int = 50
  $after: String
) {
  trading {
    personalInventory(
      characterIds: $characterIds
      kind: holders
      groupKey: $groupKey
      first: $first
      after: $after
    ) {
      ...TradingInventoryStatus
      holders {
        endCursor
        hasNextPage
        rows {
          characterId
          userId
          characterName
          groupKey
          currentQuantity
          staleQuantity
          source {
            ...TradingInventoryClock
          }
        }
      }
    }
  }
}
