schema: spec-driven

context: |
  Project: @evespace/esi-client, a greenfield TypeScript SDK for EVE Online ESI.
  Package: ESM-only, Node.js 22.18+, pnpm 11.22.0, TypeScript, fetch-based transport.
  Build direction: pinned tsdown over Rolldown, Oxc isolated declarations, native TypeScript 7 type checking, type-aware Oxlint, Oxfmt, neutral ES2022 output, no published source maps.
  SDK direction: one generated domain client and generic operation executor from a corrected pinned ESI OpenAPI 3.1 specification.
  Runtime contracts: generated Zod 4 schemas, Zod as a required peer dependency, JSON-native date values, loose response objects.
  Safety: generic mutations are double-gated; named typed mutations represent explicit caller intent; secrets must never enter metadata or errors.
  Packaging: generated documentation and examples live in the repository and documentation site, not the npm tarball.
  Release state: npm latest is 1.0.1; local 2.0.0 is unpublished and reserved for the breaking SDK release.
  Active ordering: modernize-build-foundation must be completed before generate-llm-ready-sdk is applied.

rules:
  proposal:
    - Identify breaking package, runtime, and release-version effects explicitly.
    - Distinguish npm package artifacts from repository and documentation-site artifacts.
  design:
    - Record public return shapes, metadata access, dependency installation semantics, and mutation safety decisions.
    - Prefer one generated source of truth and fail closed on unsupported OpenAPI constructs.
  tasks:
    - Keep tasks dependency-ordered, independently verifiable, and explicit about prerequisite changes.
    - Include clean generation, packed-package validation, type tests, and size checks before release.

operations:
  apply:
    guidance:
      - Apply and validate modernize-build-foundation before generate-llm-ready-sdk.
      - Stop on generated drift, unsupported schema constructs, package-resolution failures, or secret-bearing test output.
  archive:
    guidance:
      - Archive modernize-build-foundation before generate-llm-ready-sdk so the package foundation capability exists first.
