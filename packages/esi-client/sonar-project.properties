sonar.projectKey=eve-space-esi-client
sonar.projectName=EVE Space ESI Client
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,src/generated/**,tests/generated/**,scripts/**/*.d.mts,**/coverage/**,**/*.d.ts,**/*.js
sonar.coverage.exclusions=**/*.config.ts,**/*.d.ts,scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
