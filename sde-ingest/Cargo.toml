[package]
name = "sde-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
postgres = { version = "0.19.14", features = ["with-time-0_3"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
zip = "8.6.0"
