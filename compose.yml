services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eve_space}
      POSTGRES_USER: ${POSTGRES_USER:-eve_space}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_space}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-eve_space}:${POSTGRES_PASSWORD:-eve_space}@postgres:5432/${POSTGRES_DB:-eve_space}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      EVE_CLIENT_ID: ${EVE_CLIENT_ID:-}
      EVE_CLIENT_SECRET: ${EVE_CLIENT_SECRET:-}
      EVE_CALLBACK_URL: ${EVE_CALLBACK_URL:-http://localhost:8788/auth/eve/callback}
      EVE_SCOPES: ${EVE_SCOPES:-}
      ESI_USER_AGENT: ${ESI_USER_AGENT:-EveSpace/0.1 @evespace/esi-client/2.0.0}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      ADMIN_SETUP_SECRET: ${ADMIN_SETUP_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - '8788:8787'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8787/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
