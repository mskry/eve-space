packages:
  - 'api'
  - 'packages/*'
  - 'features/*/server'
  - 'features/*/nuxt'

injectWorkspacePackages: true

allowBuilds:
  cpu-features: false
  esbuild: true
  fsevents: true
  lefthook: true
  msgpackr-extract: false
  msw: true
  protobufjs: false
  ssh2: false
  vue-demi: true

minimumReleaseAgeExclude:
  - '@evespace/esi-client@2.0.0'
