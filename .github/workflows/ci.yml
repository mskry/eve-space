name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dead code
        run: pnpm knip

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Frontend
            command: pnpm test:frontend
            playwright: false
          - name: API
            command: pnpm test:api
            playwright: false
          - name: Modules
            command: pnpm test:modules
            playwright: true
          - name: Registry
            command: pnpm test:registry
            playwright: false
          - name: PostgreSQL
            command: pnpm test:postgres
            playwright: false
          - name: Redis
            command: pnpm test:redis:no-coverage
            playwright: false
          - name: E2E
            command: pnpm test:e2e
            playwright: true
          - name: Packaging
            command: pnpm test:packaging
            playwright: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: ${{ matrix.playwright }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ${{ matrix.name }} checks
        run: ${{ matrix.command }}

  rust:
    name: Rust quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: 'sde-ingest -> target'

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path sde-ingest/Cargo.toml -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --locked
          --manifest-path sde-ingest/Cargo.toml
          --all-targets
          --all-features
          --
          -D warnings

      - name: Run Rust tests
        run: >-
          cargo test
          --locked
          --manifest-path sde-ingest/Cargo.toml
          --all-features
