name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check dead code
        run: pnpm knip

      - name: Type-check
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test:frontend

      - name: Run API tests
        run: pnpm test:api

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production E2E tests
        run: pnpm test:e2e

      - name: Run module tests
        run: pnpm test:modules

      - name: Verify production packaging
        run: pnpm test:packaging

  rust:
    name: Rust quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: 'sde-ingest -> target'

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path sde-ingest/Cargo.toml -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --locked
          --manifest-path sde-ingest/Cargo.toml
          --all-targets
          --all-features
          --
          -D warnings

      - name: Run Rust tests
        run: >-
          cargo test
          --locked
          --manifest-path sde-ingest/Cargo.toml
          --all-features
