name: ESI Client

on:
  pull_request:
    paths:
      - '.github/workflows/esi-client.yml'
      - '.github/workflows/esi-client-publish.yml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/esi-client/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/esi-client.yml'
      - '.github/workflows/esi-client-publish.yml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/esi-client/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: esi-client-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate ESI client
        run: pnpm esi:validate

  analysis:
    name: ESI client analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: esi-client-analysis-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESI client coverage
        run: pnpm --filter @evespace/esi-client test:coverage

      - name: Require ESI client Sonar token
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.fork == false
        env:
          ESI_CLIENT_SONAR_TOKEN: ${{ secrets.ESI_CLIENT_SONAR_TOKEN }}
        run: |
          if [ -z "$ESI_CLIENT_SONAR_TOKEN" ]; then
            echo "::error::ESI_CLIENT_SONAR_TOKEN is required for trusted ESI analysis."
            exit 1
          fi

      - name: Analyze ESI client with SonarQube Cloud
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.fork == false
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.ESI_CLIENT_SONAR_TOKEN }}
        with:
          projectBaseDir: packages/esi-client
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=mskry_eve-space_esi-client
            -Dsonar.organization=mskry

      - name: Upload ESI client coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: esi-client-coverage
          if-no-files-found: error
          path: packages/esi-client/coverage/lcov.info
          retention-days: 14
