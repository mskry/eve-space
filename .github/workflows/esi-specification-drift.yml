name: ESI Specification Drift

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report ESI specification drift
        run: pnpm --filter @evespace/esi-client drift:report --output drift-report/esi-specification-drift.json

      - name: Publish drift report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: esi-specification-drift
          path: packages/esi-client/drift-report/esi-specification-drift.json
          if-no-files-found: error
          retention-days: 30
